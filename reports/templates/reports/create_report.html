{% load static %}
{% load hospital_tags %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدخال البيانات الطبية الشاملة</title>
        <!-- ✅ تحميل مكتبة الترجمة من CDN موثوق -->
        <script src="https://cdn.jsdelivr.net/npm/@vitalets/google-translate-api@1.0.0/dist/google-translate-api.min.js"></script>  
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f6f9;
            --card: #ffffff;
            --border: #dcdde1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            padding: 20px;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 780px;
            width: 100%;
            margin: 20px auto;
            background: var(--card);
            padding: 35px 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        h2 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 25px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 12px;
            font-size: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary);
        }

        label .required {
            color: var(--danger);
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
            background: #fff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.12);
        }

        input[readonly] {
            background: #f0f2f5;
            color: #555;
        }

        .custom-input {
            display: none;
            margin-top: 8px;
            background-color: #fffde7;
            border: 1px solid #fbc02d;
        }

        .custom-input.active {
            display: block;
        }

        .btn-generate {
            background-color: var(--success);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.35);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* ===== رسائل الخطأ ===== */
        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .form-group.error input,
        .form-group.error select {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.12);
        }

        /* ===== التجاوب ===== */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .full-width {
                grid-column: span 1;
            }
            h2 {
                font-size: 20px;
            }
            .btn-generate {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📋 إدخال بيانات التقرير الطبي الشامل</h2>

        <div class="form-grid">

            <!-- ===== نوع الإجازة ===== -->
            <div class="form-group">
                <label>نوع الإجازة <span class="required">*</span></label>
                <select id="leaveType">
                    <option value="حكومي">حكومي</option>
                    <option value="خاص">خاص</option>
                    <option value="شعار">شعار</option>
                </select>
            </div>

            <!-- ===== الرقم التسلسلي ===== -->
            <div class="form-group">
                <label>الرقم التسلسلي</label>
                <input type="text" id="serialNo" readonly>
            </div>

            <!-- ===== رقم الهوية ===== -->
            <div class="form-group full-width">
                <label>رقم الهوية / الإقامة <span class="required">*</span></label>
                <input type="text" id="nationalId" placeholder="أدخل رقم الهوية أو الإقامة">
                <div class="error-message" id="nationalIdError">رقم الهوية مطلوب</div>
            </div>

            <!-- ===== الاسم بالعربية ===== -->
            <div class="form-group">
                <label>الاسم الرباعي بالعربية <span class="required">*</span></label>
                <input type="text" id="nameAr" placeholder="اكتب الاسم الكامل" oninput="translateFullSentence('nameAr', 'nameEn')">
                <div class="error-message" id="nameArError">الاسم مطلوب</div>
            </div>

            <!-- ===== الاسم بالإنجليزية ===== -->
            <div class="form-group">
                <label>الاسم بالإنجليزية (تلقائي)</label>
                <input type="text" id="nameEn" placeholder="Patient Full Name" readonly>
            </div>

            <!-- ===== جهة العمل ===== -->
            <div class="form-group full-width">
                <label>جهة العمل</label>
                <input type="text" id="employer" value="وزارة الموارد البشرية والتمكين الاجتماعي">
            </div>

            <!-- ===== نوع المرض ===== -->
            <div class="form-group full-width">
                <label>نوع المرض / التشخيص الدقيق <span class="required">*</span></label>
                <select id="diseaseType" onchange="toggleCustomDisease()">
                    <option value="إصابة حادة في العظام والمفاصل / Acute Bone & Joint Injury">إصابة حادة في العظام والمفاصل</option>
                    <option value="كسر مضاعف في العظام / Compound Bone Fracture">كسر مضاعف في العظام</option>
                    <option value="التواء شديد في الكاحل / Severe Ankle Sprain">التواء شديد في الكاحل</option>
                    <option value="انزلاق غضروفي قطني حاد / Acute Lumbar Disc Prolapse">انزلاق غضروفي قطني حاد</option>
                    <option value="شد عضلي حاد وفقرات الظهر / Acute Muscle Strain">شد عضلي حاد وفقرات الظهر</option>
                    <option value="نزلة معوية حادة وجفاف / Acute Gastroenteritis">نزلة معوية حادة وجفاف</option>
                    <option value="التهاب جدار المعدة الحاد وقرحة / Acute Gastritis">التهاب جدار المعدة الحاد وقرحة</option>
                    <option value="مغص كلوي حاد مع حصوات / Acute Renal Colic">مغص كلوي حاد مع حصوات</option>
                    <option value="إنفلونزا حادة مع ارتفاع الحرارة / Severe Influenza">إنفلونزا حادة مع ارتفاع الحرارة</option>
                    <option value="التهاب الحلق اللوزتين الحاد / Acute Tonsillitis">التهاب الحلق اللوزتين الحاد</option>
                    <option value="أزمة ربوية حادة وصعوبة تنفس / Acute Asthma Attack">أزمة ربوية حادة وصعوبة تنفس</option>
                    <option value="إرهاق عام ووعكة صحية طارئة / General Fatigue">إرهاق عام ووعكة صحية طارئة</option>
                    <option value="CUSTOM">✨ أخرى - كتابة مرض مخصص غير مدرج بالقائمة...</option>
                </select>
                <input type="text" id="customDisease" class="custom-input" placeholder="اكتب اسم المرض المخصص هنا يدوياً">
                <div class="error-message" id="diseaseError">المرض مطلوب</div>
            </div>

            <!-- ===== تاريخ الدخول ===== -->
            <div class="form-group">
                <label>تاريخ الدخول ميلادي <span class="required">*</span></label>
                <input type="date" id="dateIn" onchange="calculateDates()">
                <div class="error-message" id="dateInError">تاريخ الدخول مطلوب</div>
            </div>

            <!-- ===== التاريخ المنسق للدخول ===== -->
            <div class="form-group">
                <label>التاريخ المنسق للدخول</label>
                <input type="text" id="dateInFormatted" readonly>
            </div>

            <!-- ===== تاريخ الدخول الهجري ===== -->
            <div class="form-group">
                <label>تاريخ الدخول الهجري</label>
                <input type="text" id="dateInHijri" readonly>
            </div>

            <!-- ===== يوم الأسبوع ===== -->
            <div class="form-group">
                <label>يوم الأسبوع</label>
                <input type="text" id="weekDay" readonly>
            </div>

            <!-- ===== تاريخ الخروج ===== -->
            <div class="form-group">
                <label>تاريخ الخروج ميلادي <span class="required">*</span></label>
                <input type="date" id="dateOut" onchange="calculateDates()">
                <div class="error-message" id="dateOutError">تاريخ الخروج مطلوب</div>
            </div>

            <!-- ===== التاريخ المنسق للخروج ===== -->
            <div class="form-group">
                <label>التاريخ المنسق للخروج</label>
                <input type="text" id="dateOutFormatted" readonly>
            </div>

            <!-- ===== تاريخ الخروج الهجري ===== -->
            <div class="form-group">
                <label>تاريخ الخروج الهجري</label>
                <input type="text" id="dateOutHijri" readonly>
            </div>

            <!-- ===== عدد الأيام ===== -->
            <div class="form-group">
                <label>إجمالي عدد الأيام</label>
                <input type="text" id="daysCount" value="1" readonly style="font-weight:700;color:var(--primary);font-size:16px;">
            </div>

            <!-- ===== تاريخ الإصدار ===== -->
            <div class="form-group">
                <label>تاريخ إصدار التقرير</label>
                <input type="date" id="issueDate">
            </div>

            <!-- ===== اسم الطبيب بالعربية ===== -->
            <div class="form-group">
                <label>اسم الطبيب بالعربية <span class="required">*</span></label>
                <input type="text" id="doctorAr" placeholder="اسم الطبيب الكامل" oninput="translateFullSentence('doctorAr', 'doctorEn')">
                <div class="error-message" id="doctorArError">اسم الطبيب مطلوب</div>
            </div>

            <!-- ===== اسم الطبيب بالإنجليزية ===== -->
            <div class="form-group">
                <label>اسم الطبيب بالإنجليزية</label>
                <input type="text" id="doctorEn" placeholder="Doctor Full Name" readonly>
            </div>

            <!-- ===== تخصص الدكتور ===== -->
            <div class="form-group">
                <label>تخصص الدكتور بالعربي</label>
                <select id="specialtyAr" onchange="syncSpecialty()">
                    <option value="طبيب عام / General Practitioner">طبيب عام</option>
                    <option value="أخصائي جراحة العظام والمفاصل / Orthopedic Surgery Specialist">أخصائي جراحة العظام</option>
                    <option value="أخصائي الأمراض الباطنية / Internal Medicine Specialist">أخصائي الأمراض الباطنية</option>
                    <option value="أخصائي جراحة عامة / General Surgery Specialist">أخصائي جراحة عامة</option>
                    <option value="أخصائي طب الطوارئ والحالات الحرجة / Emergency Medicine Specialist">أخصائي طب الطوارئ</option>
                    <option value="أخصائي طب الأطفال / Pediatric Specialist">أخصائي طب الأطفال</option>
                    <option value="CUSTOM">✨ أخرى - كتابة تخصص مخصص...</option>
                </select>
                <input type="text" id="customSpecialtyAr" class="custom-input" placeholder="اكتب التخصص بالعربية" oninput="translateFullSentence('customSpecialtyAr', 'customSpecialtyEn')">
            </div>

            <!-- ===== التخصص بالإنجليزية ===== -->
            <div class="form-group">
                <label>التخصص بالإنجليزية</label>
                <input type="text" id="specialtyEn" value="General Practitioner" readonly>
                <input type="text" id="customSpecialtyEn" class="custom-input" placeholder="Specialty in English" style="margin-top:8px;">
            </div>

            <!-- ===== المستشفى ===== -->
            <!-- في create_report.html - استبدال حقل المستشفى بقائمة منسدلة -->

            <!-- ===== المستشفى ===== -->
            <div class="form-group">
                <label>المستشفى / المركز الطبي <span class="required">*</span></label>
                <select id="hospitalSelect" onchange="updateHospitalFields()">
                    <option value="">-- اختر المستشفى --</option>
                    {% for hospital in hospitals %}
                        <option value="{{ hospital.id }}" 
                                data-name-ar="{{ hospital.name_ar }}"
                                data-name-en="{{ hospital.name_en }}"
                                data-logo-url="{% if hospital.logo %}{{ hospital.logo.url }}{% endif %}">
                            {{ hospital.name_ar }}
                        </option>
                    {% endfor %}
                    <option value="CUSTOM">✨ أخرى - إضافة مستشفى جديد</option>
                </select>
                
                <!-- حقل مخصص لإضافة مستشفى جديد -->
                <input type="text" id="customHospitalAr" class="custom-input" 
                    placeholder="اكتب اسم المستشفى بالعربية" 
                    oninput="translateFullSentence('customHospitalAr', 'customHospitalEn')">
                <input type="text" id="customHospitalEn" class="custom-input" 
                    placeholder="Hospital Name in English" style="margin-top:8px;">
                <!-- حقل رفع شعار المستشفى (يظهر فقط عند اختيار "أخرى") -->
                <input type="file" id="customHospitalLogo" class="custom-input" accept="image/*" style="margin-top:8px;">
                <div id="customHospitalLogoPreview" class="custom-input" style="margin-top:8px; display:none;">
                    <label>معاينة الشعار</label>
                    <div style="text-align:center; padding:8px; border:1px dashed #ddd; border-radius:6px;">
                        <img id="customHospitalLogoImg" src="" alt="معاينة الشعار" style="max-width:120px; max-height:80px; object-fit:contain;">
                    </div>
                </div>
                
                <div class="error-message" id="hospitalArError">المستشفى مطلوب</div>
            </div>

            <!-- ===== معاينة الشعار ===== -->
            <div class="form-group full-width" id="logoPreviewContainer" style="display:none;">
                <label>شعار المستشفى</label>
                <div style="text-align:center; padding:10px; border:1px dashed #ddd; border-radius:8px;">
                    <img id="hospitalLogoPreview" src="" alt="شعار المستشفى" 
                        style="max-width:150px; max-height:100px; object-fit:contain;">
                </div>
            </div>

            <!-- ===== المستشفى بالإنجليزي ===== -->
            <div class="form-group">
                <label>المستشفى بالإنجليزي</label>
                <input type="text" id="hospitalEn" value="King Fahd General Specialist Hospital" readonly>
            </div>

            <!-- ===== الوقت الحالي ===== -->
            <div class="form-group">
                <label>الوقت الحالي</label>
                <input type="text" id="currentTime">
            </div>

            <!-- ===== جنسية المريض ===== -->
            <div class="form-group">
                <label>جنسية المريض</label>
                <select id="natAr" onchange="syncNationality()">
                    <option value="سعودي / Saudi">سعودي</option>
                    <option value="يمني / Yemeni">يمني</option>
                    <option value="مصري / Egyptian">مصري</option>
                    <option value="سوداني / Sudanese">سوداني</option>
                    <option value="سوري / Syrian">سوري</option>
                </select>
            </div>

            <!-- ===== الجنسية بالإنجليزي ===== -->
            <div class="form-group">
                <label>الجنسية بالإنجليزي</label>
                <input type="text" id="natEn" value="Saudi" readonly>
            </div>

            <!-- ===== صلة القرابة ===== -->
            <div class="form-group">
                <label>صلة القرابة</label>
                <select id="poiAr" onchange="syncRelationship()">
                    <option value="نفسه / Self">نفسه</option>
                    <option value="أب / Father">أب</option>
                    <option value="أم / Mother">أم</option>
                </select>
            </div>

            <!-- ===== صلة القرابة بالإنجليزي ===== -->
            <div class="form-group">
                <label>صلة القرابة بالإنجليزي</label>
                <input type="text" id="poiEn" value="Self" readonly>
            </div>

        </div>

        <!-- ===== زر الحفظ ===== -->
        <button class="btn-generate" onclick="saveAndRedirect()">
            💾 حفظ البيانات والانتقال لصفحة التقرير والباركود ➡️
        </button>

    </div>

    <script>
        // ============================================================
        // قاموس الترجمة
        // ============================================================
        // قاموس الأسماء العربية مع ترجمتها الصحيحة
        // ============================================================
        const nameTranslations = {
            // الأسماء الشائعة
            "عمر": "Omar",
            "عمرو": "Amr",
            "محمد": "Mohammed",
            "أحمد": "Ahmed",
            "احمد": "Ahmed",
            "علي": "Ali",
            "خالد": "Khaled",
            "عبدالله": "Abdullah",
            "عبدالرحمن": "Abdulrahman",
            "عبدالعزيز": "Abdulaziz",
            "عبدالملك": "Abdulmalik",
            "عبدالوهاب": "Abdulwahab",
            "سعود": "Saud",
            "فهد": "Fahd",
            "ناصر": "Naser",
            "سعيد": "Saeed",
            "ماجد": "Majed",
            "سلطان": "Sultan",
            "فيصل": "Faisal",
            "تركي": "Turki",
            "بدر": "Badr",
            "حسن": "Hassan",
            "حسين": "Hussein",
            "زيد": "Zaid",
            "سالم": "Salem",
            "طلال": "Talal",
            "منصور": "Mansour",
            "راشد": "Rashid",
            "مبارك": "Mubarak",
            "إبراهيم": "Ibrahim",
            "اسماعيل": "Ismail",
            "يعقوب": "Yacoub",
            "يوسف": "Yousef",
            "موسى": "Mousa",
            "عيسى": "Isa",
            "داود": "Dawood",
            "سليمان": "Suleiman",
            "ايوب": "Ayoub",
            "يونس": "Younis",
            "نوح": "Noah",
            "ادم": "Adam",
        };

        const generalTranslations = {
            "مستشفى": "Hospital",
            "الملك": "King",
            "فهد": "Fahd",
            "العام": "General",
            "التخصصي": "Specialist",
            "وزارة": "Ministry",
            "الموارد": "Human Resources",
            "البشرية": "Human",
            "والتمكين": "Empowerment",
            "الاجتماعي": "Social",
        };

        // دمج القواميس
        const fullDictionary = { ...nameTranslations, ...generalTranslations };

        // ============================================================
        // دالة الترجمة المحسنة (بدون مكتبات خارجية)
        // ============================================================
        function translateFullSentence(sourceId, targetId) {
            const srcValue = document.getElementById(sourceId).value.trim();
            if (!srcValue) {
                document.getElementById(targetId).value = '';
                return;
            }

            const words = srcValue.split(/\s+/);
            const translatedWords = words.map(word => {
                // ✅ البحث في القاموس أولاً
                if (fullDictionary[word]) {
                    return fullDictionary[word];
                }
                
                // ✅ الترجمة الحرفية المحسنة
                const chars = {
                    "ا": "a", "ب": "b", "ت": "t", "ث": "th",
                    "ج": "j", "ح": "h", "خ": "kh", "د": "d",
                    "ذ": "dh", "ر": "r", "ز": "z", "س": "s",
                    "ش": "sh", "ص": "s", "ض": "d", "ط": "t",
                    "ظ": "z", "ع": "a", "غ": "gh", "ف": "f",
                    "ق": "q", "ك": "k", "ل": "l", "م": "m",
                    "ن": "n", "ه": "h", "و": "w", "ي": "y",
                    "ة": "h", "ى": "a", "ء": "",
                    "ؤ": "a", "ئ": "a", "آ": "a"
                };
                
                let res = "";
                let prevChar = "";
                let nextChar = "";
                
                for (let i = 0; i < word.length; i++) {
                    const char = word[i];
                    prevChar = i > 0 ? word[i-1] : "";
                    nextChar = i < word.length - 1 ? word[i+1] : "";
                    
                    // معالجة الحروف الخاصة
                    if (char === "ع") {
                        // إذا كان الحرف ع في البداية أو بعد حرف ساكن
                        if (i === 0 || prevChar === "ا" || prevChar === "و" || prevChar === "ي") {
                            res += "'" + (chars[char] || char);
                        } else {
                            res += chars[char] || char;
                        }
                    } else if (char === "ة" && i === word.length - 1) {
                        res += "h";
                    } else if (char === "ى" && i === word.length - 1) {
                        res += "a";
                    } else {
                        res += chars[char] || char;
                    }
                }
                
                // معالجة الأسماء التي تبدأ بـ "عبد"
                if (word.startsWith("عبد")) {
                    const rest = res.substring(4);
                    res = "Abdul" + rest;
                }
                
                return res.charAt(0).toUpperCase() + res.slice(1).toLowerCase();
            });
            
            document.getElementById(targetId).value = translatedWords.join(" ");
        }

        // ============================================================
        // 🔥🔥🔥 دالة تحديث حقل المستشفى (الجديدة) 🔥🔥🔥
        // ============================================================
        function updateHospitalFields() {
            const select = document.getElementById('hospitalSelect');
            const customAr = document.getElementById('customHospitalAr');
            const customEn = document.getElementById('customHospitalEn');
            const logoPreview = document.getElementById('logoPreviewContainer');
            const logoImg = document.getElementById('hospitalLogoPreview');
            const hospitalArInput = document.getElementById('hospitalAr');
            const hospitalEnInput = document.getElementById('hospitalEn');
            const customLogoInput = document.getElementById('customHospitalLogo');
            const customLogoPreview = document.getElementById('customHospitalLogoPreview');
            const customLogoImg = document.getElementById('customHospitalLogoImg');
            
            const isCustom = select.value === 'CUSTOM';
            
            // إظهار/إخفاء الحقول المخصصة
            if (customAr) {
                customAr.classList.toggle('active', isCustom);
            }
            if (customEn) {
                customEn.classList.toggle('active', isCustom);
            }
            // إظهار حقل رفع الشعار للمستشفى المخصص
            if (customLogoInput) {
                customLogoInput.classList.toggle('active', isCustom);
                // إذا لم نختَر مخصصاً نضغط على إخفاء معاينة الشعار المخصص
                if (!isCustom && customLogoPreview) {
                    customLogoPreview.style.display = 'none';
                    if (customLogoImg) customLogoImg.src = '';
                    customLogoInput.value = null;
                }
            }
            
            if (!isCustom && select.value) {
                // ✅ مستشفى موجود في القائمة
                const selectedOption = select.options[select.selectedIndex];
                const logoUrl = selectedOption.dataset.logoUrl || '';
                const nameAr = selectedOption.dataset.nameAr || '';
                const nameEn = selectedOption.dataset.nameEn || '';
                
                // تعيين الحقول
                if (hospitalArInput) hospitalArInput.value = nameAr;
                if (hospitalEnInput) hospitalEnInput.value = nameEn;
                
                // عرض الشعار الافتراضي للمستشفى من القائمة
                if (logoPreview && logoImg) {
                    if (logoUrl && logoUrl !== 'None' && logoUrl !== '') {
                        logoImg.src = logoUrl;
                        logoPreview.style.display = 'block';
                    } else {
                        logoPreview.style.display = 'none';
                        logoImg.src = '';
                    }
                }
                
                // تحديث حقل الجهة (اختياري)
                const employerInput = document.getElementById('employer');
                if (employerInput && !employerInput.value) {
                    employerInput.value = nameAr;
                }
                
            } else if (isCustom) {
                // ✅ اختيار "أخرى"
                if (hospitalArInput) hospitalArInput.value = '';
                if (hospitalEnInput) hospitalEnInput.value = '';
                if (logoPreview) logoPreview.style.display = 'none';
                if (logoImg) logoImg.src = '';
                // إظهار/تهيئة معاينة الشعار المخصص (ستظهر فقط عند اختيار ملف)
                if (customLogoPreview) customLogoPreview.style.display = 'none';
                if (customLogoImg) customLogoImg.src = '';
            }
            
            // إضافة مستمع لتحديث معاينة الشعار المخصص عند اختيار ملف جديد
            if (customLogoInput && !customLogoInput.dataset.listenerAdded) {
                customLogoInput.addEventListener('change', function(e) {
                    const f = this.files && this.files[0] ? this.files[0] : null;
                    if (!f) {
                        if (customLogoPreview) customLogoPreview.style.display = 'none';
                        if (customLogoImg) customLogoImg.src = '';
                        return;
                    }
                    const objectUrl = URL.createObjectURL(f);
                    if (customLogoImg) customLogoImg.src = objectUrl;
                    if (customLogoPreview) customLogoPreview.style.display = 'block';
                });
                customLogoInput.dataset.listenerAdded = '1';
            }
        }

        // ============================================================
        // التحكم في الحقول المخصصة
        // ============================================================
        function toggleCustomDisease() {
            const select = document.getElementById('diseaseType');
            const input = document.getElementById('customDisease');
            if (input) {
                input.classList.toggle('active', select.value === 'CUSTOM');
                if (select.value !== 'CUSTOM') {
                    input.value = '';
                }
            }
        }

        function syncSpecialty() {
            const select = document.getElementById('specialtyAr');
            const customAr = document.getElementById('customSpecialtyAr');
            const customEn = document.getElementById('customSpecialtyEn');
            const normalEn = document.getElementById('specialtyEn');
            const isCustom = select.value === 'CUSTOM';

            if (customAr) customAr.classList.toggle('active', isCustom);
            if (customEn) customEn.classList.toggle('active', isCustom);
            if (normalEn) normalEn.style.display = isCustom ? 'none' : 'block';

            if (!isCustom) {
                const parts = select.value.split(' / ');
                if (normalEn) normalEn.value = parts[1] || "";
                if (customAr) customAr.value = '';
                if (customEn) customEn.value = '';
            }
        }

        function syncNationality() {
            const s = document.getElementById('natAr');
            const natEn = document.getElementById('natEn');
            if (s && natEn) {
                natEn.value = s.value.split(' / ')[1] || "";
            }
        }

        function syncRelationship() {
            const s = document.getElementById('poiAr');
            const poiEn = document.getElementById('poiEn');
            if (s && poiEn) {
                poiEn.value = s.value.split(' / ')[1] || "";
            }
        }

        // ============================================================
        // حساب التواريخ
        // ============================================================
        function calculateDates() {
            const d1 = document.getElementById('dateIn');
            const d2 = document.getElementById('dateOut');
            const dateInFormatted = document.getElementById('dateInFormatted');
            const dateInHijri = document.getElementById('dateInHijri');
            const weekDay = document.getElementById('weekDay');
            const dateOutFormatted = document.getElementById('dateOutFormatted');
            const dateOutHijri = document.getElementById('dateOutHijri');
            const daysCount = document.getElementById('daysCount');
            
            const hijriOptions = { day: 'numeric', month: 'long', year: 'numeric' };

            if (d1 && d1.value) {
                const dateIn = new Date(d1.value);
                if (dateInFormatted) {
                    dateInFormatted.value = dateIn.toLocaleDateString('en-GB');
                }
                if (dateInHijri) {
                    dateInHijri.value = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',
                        hijriOptions).format(dateIn);
                }
                if (weekDay) {
                    weekDay.value = dateIn.toLocaleDateString('ar-SA', { weekday: 'long' });
                }
            }

            if (d2 && d2.value) {
                const dateOut = new Date(d2.value);
                if (dateOutFormatted) {
                    dateOutFormatted.value = dateOut.toLocaleDateString('en-GB');
                }
                if (dateOutHijri) {
                    dateOutHijri.value = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',
                        hijriOptions).format(dateOut);
                }
            }

            if (d1 && d1.value && d2 && d2.value) {
                const diff = Math.ceil((new Date(d2.value) - new Date(d1.value)) / (1000 * 60 * 60 * 24));
                if (daysCount) {
                    daysCount.value = diff >= 0 ? diff + 1 : 1;
                }
            }
        }

        // ============================================================
        // توليد الرقم التسلسلي
        // ============================================================
        function generateSerial() {
            const year = new Date().getFullYear();
            const random = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            return `GSL${year}${random}`;
        }

        // ============================================================
        // التحقق من صحة البيانات (محسّن لدعم المستشفى من القائمة)
        // ============================================================
        function validateForm() {
            let isValid = true;
            const errors = [];

            // إخفاء جميع الأخطاء السابقة
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.form-group').forEach(el => el.classList.remove('error'));

            // التحقق من الحقول الإلزامية
            const fields = [
                { id: 'nationalId', name: 'رقم الهوية', errorId: 'nationalIdError' },
                { id: 'nameAr', name: 'الاسم', errorId: 'nameArError' },
                { id: 'dateIn', name: 'تاريخ الدخول', errorId: 'dateInError' },
                { id: 'dateOut', name: 'تاريخ الخروج', errorId: 'dateOutError' },
                { id: 'doctorAr', name: 'اسم الطبيب', errorId: 'doctorArError' },
            ];

            fields.forEach(f => {
                const el = document.getElementById(f.id);
                if (!el || !el.value.trim()) {
                    isValid = false;
                    errors.push(`❌ ${f.name} مطلوب`);
                    const errorEl = document.getElementById(f.errorId);
                    if (errorEl) errorEl.classList.add('active');
                    if (el) el.closest('.form-group')?.classList.add('error');
                }
            });

            // 🔥 التحقق من المستشفى (من القائمة أو مخصص)
            const hospitalSelect = document.getElementById('hospitalSelect');
            const customHospitalAr = document.getElementById('customHospitalAr');
            const hospitalAr = document.getElementById('hospitalAr');
            
            if (hospitalSelect) {
                if (hospitalSelect.value === 'CUSTOM') {
                    // المستشفى مخصص - نتحقق من الحقل المخصص
                    if (!customHospitalAr || !customHospitalAr.value.trim()) {
                        isValid = false;
                        errors.push('❌ اسم المستشفى المخصص مطلوب');
                        if (customHospitalAr) {
                            customHospitalAr.closest('.form-group')?.classList.add('error');
                        }
                    }
                } else if (!hospitalSelect.value) {
                    // لم يتم اختيار مستشفى
                    isValid = false;
                    errors.push('❌ يرجى اختيار المستشفى');
                    hospitalSelect.closest('.form-group')?.classList.add('error');
                }
            } else if (hospitalAr && !hospitalAr.value.trim()) {
                isValid = false;
                errors.push('❌ المستشفى مطلوب');
                const errorEl = document.getElementById('hospitalArError');
                if (errorEl) errorEl.classList.add('active');
                if (hospitalAr) hospitalAr.closest('.form-group')?.classList.add('error');
            }

            // التحقق من المرض
            const diseaseSelect = document.getElementById('diseaseType');
            const customDisease = document.getElementById('customDisease');
            if (diseaseSelect) {
                if (diseaseSelect.value === 'CUSTOM' && (!customDisease || !customDisease.value.trim())) {
                    isValid = false;
                    errors.push('❌ المرض المخصص مطلوب');
                    const errorEl = document.getElementById('diseaseError');
                    if (errorEl) errorEl.classList.add('active');
                    if (customDisease) customDisease.closest('.form-group')?.classList.add('error');
                }
            }

            // التحقق من تاريخ الخروج > تاريخ الدخول
            const dateIn = document.getElementById('dateIn');
            const dateOut = document.getElementById('dateOut');
            if (dateIn && dateOut && dateIn.value && dateOut.value && new Date(dateOut.value) < new Date(dateIn.value)) {
                isValid = false;
                errors.push('❌ تاريخ الخروج يجب أن يكون بعد تاريخ الدخول');
            }

            // عرض الأخطاء في تنبيه
            if (!isValid) {
                alert('❌ يرجى تصحيح الأخطاء التالية:\n\n' + errors.join('\n'));
            }

            return isValid;
        }

        // ============================================================
        // 🔥🔥🔥 حفظ البيانات والانتقال (نسخة محسّنة) 🔥🔥🔥
        // ============================================================
        async function saveAndRedirect() {
            if (!validateForm()) return;

            // ===== استخراج بيانات المستشفى =====
            let hospitalAr = '';
            let hospitalEn = '';
            let hospitalId = '';
            
            const hospitalSelect = document.getElementById('hospitalSelect');
            const customHospitalAr = document.getElementById('customHospitalAr');
            const customHospitalEn = document.getElementById('customHospitalEn');
            const hospitalArInput = document.getElementById('hospitalAr');
            const hospitalEnInput = document.getElementById('hospitalEn');
            
            if (hospitalSelect) {
                if (hospitalSelect.value === 'CUSTOM') {
                    // ✅ مستشفى مخصص
                    hospitalAr = customHospitalAr ? customHospitalAr.value.trim() : '';
                    hospitalEn = customHospitalEn ? customHospitalEn.value.trim() : '';
                    hospitalId = '';
                } else if (hospitalSelect.value) {
                    // ✅ من القائمة
                    const selectedOption = hospitalSelect.options[hospitalSelect.selectedIndex];
                    hospitalAr = selectedOption.dataset.nameAr || '';
                    hospitalEn = selectedOption.dataset.nameEn || '';
                    hospitalId = hospitalSelect.value;
                }
            } else {
                // ✅ استخدام الحقول العادية (للتوافق مع الإصدارات القديمة)
                hospitalAr = hospitalArInput ? hospitalArInput.value.trim() : '';
                hospitalEn = hospitalEnInput ? hospitalEnInput.value.trim() : '';
            }

            // ===== استخراج البيانات =====
            let diseaseType = document.getElementById('diseaseType')?.value || '';
            let customDisease = '';

            if (diseaseType === 'CUSTOM') {
                customDisease = document.getElementById('customDisease')?.value.trim() || '';
                diseaseType = '';
            }

            let specialty = document.getElementById('specialtyAr')?.value || '';
            if (specialty === 'CUSTOM') {
                const customAr = document.getElementById('customSpecialtyAr')?.value.trim() || '';
                const customEn = document.getElementById('customSpecialtyEn')?.value.trim() || '';
                specialty = customAr + ' / ' + customEn;
            }

            // ===== إذا كان مستشفى مخصص — تأكد من إنشائه أولاً عن طريق الإرسال إلى CreateHospitalView
            const isCustomHospital = hospitalSelect && hospitalSelect.value === 'CUSTOM';
            let hospitalIdToSend = hospitalId;

            if (isCustomHospital) {
                // تحقق من وجود اسم المستشفى
                if (!customHospitalAr) {
                    alert('يرجى ملء اسم المستشفى بالعربية قبل الحفظ.');
                    return;
                }

                const logoInput = document.getElementById('customHospitalLogo');
                const logoFile = logoInput && logoInput.files && logoInput.files[0] ? logoInput.files[0] : null;
                const form = new FormData();
                form.append('name_ar', customHospitalAr);
                form.append('name_en', customHospitalEn);
                if (logoFile) form.append('logo', logoFile);

                try {
                    const createRes = await fetch('/reports/create_hospital/', {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': getCSRFToken(),
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: form
                    });
                    const createJson = await createRes.json();
                    if (!createJson.success) {
                        alert('حدث خطأ أثناء إنشاء المستشفى: ' + (createJson.error || 'خطأ غير معروف'));
                        return;
                    }
                    hospitalIdToSend = createJson.id;
                } catch (err) {
                    console.error('خطأ أثناء إنشاء المستشفى:', err);
                    alert('فشل إنشاء المستشفى. تحقق من الاتصال وحاول مرة أخرى.');
                    return;
                }
            }

            const reportData = {
                serialNo: document.getElementById('serialNo')?.value || generateSerial(),
                nationalId: document.getElementById('nationalId')?.value.trim() || '',
                nameAr: document.getElementById('nameAr')?.value.trim() || '',
                nameEn: document.getElementById('nameEn')?.value.trim() || '',
                employer: document.getElementById('employer')?.value.trim() || '',
                diseaseType: diseaseType,
                customDisease: customDisease,
                disease: diseaseType || customDisease,
                specialty: specialty,
                dateIn: document.getElementById('dateInFormatted')?.value || '',
                dateInHijri: document.getElementById('dateInHijri')?.value || '',
                dateOut: document.getElementById('dateOutFormatted')?.value || '',
                dateOutHijri: document.getElementById('dateOutHijri')?.value || '',
                days: document.getElementById('daysCount')?.value || 1,
                issueDate: document.getElementById('issueDate')?.value || '',
                doctorAr: document.getElementById('doctorAr')?.value.trim() || '',
                doctorEn: document.getElementById('doctorEn')?.value.trim() || '',
                // 🔥 بيانات المستشفى المحسنة
                hospitalAr: hospitalAr,
                hospitalEn: hospitalEn,
                hospitalId: hospitalIdToSend,
                nationality: document.getElementById('natAr')?.value || '',
                nationalityEn: document.getElementById('natEn')?.value || '',
                relationship: document.getElementById('poiAr')?.value || '',
                relationshipEn: document.getElementById('poiEn')?.value || '',
                weekDay: document.getElementById('weekDay')?.value || '',
                currentTime: document.getElementById('currentTime')?.value || '',
                isPredefinedHospital: hospitalSelect ? hospitalSelect.value !== 'CUSTOM' && hospitalSelect.value !== '' : false,
            };

            // 🔥 حفظ في localStorage
            localStorage.setItem('sharedMedicalData', JSON.stringify(reportData));

            // 🔥 إرسال البيانات إلى Django API
            try {
                const response = await fetch('/reports/api/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCSRFToken(),
                    },
                    body: JSON.stringify(reportData)
                });
                const data = await response.json();
                if (data.success) {
                    // الانتقال إلى صفحة التقرير
                    window.location.href = `/reports/${data.report_id}/detail/`;
                } else {
                    alert('❌ خطأ: ' + (data.error || 'حدث خطأ غير متوقع'));
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                alert('❌ خطأ في الاتصال: ' + error.message);
            }
        }

        // ============================================================
        // دالة الحصول على CSRF Token
        // ============================================================
        function getCSRFToken() {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
            return cookieValue || '';
        }

        // ============================================================
        // 🔥 عند تحميل الصفحة (محسّن)
        // ============================================================
        window.onload = function() {
            // ===== تعيين التواريخ =====
            const today = new Date().toISOString().split('T')[0];
            const dateIn = document.getElementById('dateIn');
            const dateOut = document.getElementById('dateOut');
            const issueDate = document.getElementById('issueDate');
            
            if (dateIn) dateIn.value = today;
            if (dateOut) dateOut.value = today;
            if (issueDate) issueDate.value = today;
            
            calculateDates();

            // ===== توليد الرقم التسلسلي =====
            const serialNo = document.getElementById('serialNo');
            if (serialNo) serialNo.value = generateSerial();

            // ===== تعيين الوقت الحالي =====
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const hours12 = (hours % 12 || 12).toString().padStart(2, '0');
            const currentTime = document.getElementById('currentTime');
            if (currentTime) currentTime.value = `${ampm} ${hours12}:${minutes}`;

            // ===== تهيئة الحقول المخصصة =====
            toggleCustomDisease();
            syncSpecialty();
            syncNationality();
            syncRelationship();
            
            // 🔥 تهيئة حقل المستشفى
            if (typeof updateHospitalFields === 'function') {
                updateHospitalFields();
            }

            // ===== إضافة مستمع للأحداث لحقل المستشفى =====
            const hospitalSelect = document.getElementById('hospitalSelect');
            if (hospitalSelect) {
                hospitalSelect.addEventListener('change', updateHospitalFields);
            }

            // ===== ملء الحقل الانجليزي تلقائياً عند كتابة اسم المستشفى بالعربي (للمستشفى المخصص) =====
            const customHospitalArInput = document.getElementById('customHospitalAr');
            const customHospitalEnInput = document.getElementById('customHospitalEn');
            const hospitalEnInput = document.getElementById('hospitalEn');
            if (customHospitalArInput) {
                // استخدم translateFullSentence الموجودة بالفعل لملء الحقل الانجليزي الخاص بالمخصص
                customHospitalArInput.addEventListener('input', function() {
                    // استدعاء دالة الترجمة الموجودة لنسخ النص للعربية -> إنجليزي
                    try { translateFullSentence('customHospitalAr', 'customHospitalEn'); } catch(e) { console.warn(e); }
                    // انسخ الناتج أيضاً إلى الحقل العام hospitalEn ليظهر فوراً في النموذج
                    setTimeout(function(){
                        if (customHospitalEnInput && hospitalEnInput) hospitalEnInput.value = customHospitalEnInput.value || '';
                    }, 0);
                });
            }
            if (customHospitalEnInput) {
                customHospitalEnInput.addEventListener('input', function(){
                    if (hospitalEnInput) hospitalEnInput.value = customHospitalEnInput.value || '';
                });
            }
        };
    </script>
